name: fork-ci

on:
  pull_request:
    branches: ['fork/11.17.4']
  push:
    branches: ['fork/11.17.4']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: npm install -g pnpm@10.27.0

      - run: pnpm install --frozen-lockfile

      - name: Lint api
        run: pnpm exec eslint api/src

      - name: Build api workspace dependencies
        run: pnpm --filter 'directus^...' run build
        env:
          NODE_OPTIONS: --max_old_space_size=6144
          npm_config_workspace_concurrency: 2

      - name: Unit tests (full api suite)
        run: pnpm test
        working-directory: api
